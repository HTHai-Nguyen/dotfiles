theme = "catppuccin_macchiato"

[editor]
line-number = "relative"
mouse = true
middle-click-paste = false
bufferline = "multiple"
color-modes = true
cursorline = true
text-width = 80

[editor.soft-wrap]
enable = true
wrap-at-text-width = true
wrap-indicator = ""

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.indent-guides]
render = true
character = "┊"

