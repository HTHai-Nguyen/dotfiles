[colors]
transparent    = #00000000
background     = #1E1E2E
background-alt = #1E1E2E
foreground     = #CDD6F4
rosewater      = #f5e0dc
flamingo       = #f2cdcd
pink           = #f5c2e7
mauve          = #cba6f7
red            = #f38ba8
maroon         = #eba0ac
peach          = #fab387
yellow         = #f9e2af
green          = #a6e3a1
teal           = #94e2d5
sky            = #89dceb
sapphire       = #74c7ec
blue           = #89b4fa
lavender       = #b4befe
overlay0       = #8087a2
surface2       = #585b70

;  ____               _
; | __ )  __ _ _ __  / |
; |  _ \ / _` | '__| | |
; | |_) | (_| | |    | |
; |____/ \__,_|_|    |_|
;

[bar/bar1]
width          = 100%
height         = 3%
;radius        = 10
;dpi           = 96
fixed-center   = true

background     = ${colors.background}
foreground     = ${colors.foreground}

line-size      = 2pt

border-size    = 3pt
border-color   = #00000000

padding-left   = 1
padding-right  = 1

module-margin  = 1

font-0         = JetBrainsMonoNerdFontPropo;2

modules-left   = custom-menu xworkspaces xwindow
modules-center = date
modules-right  = backlight pulseaudio cpu memory systray

cursor-click   = pointer
cursor-scroll  = ns-resize

enable-ipc     = true

; separator = |
; separator-foreground = ${colors.foreground}

;=============================
;  ____               ____
; | __ )  __ _ _ __  |___ \
; |  _ \ / _` | '__|   __) |
; | |_) | (_| | |     / __/
; |____/ \__,_|_|    |_____|
;

[bar/bar2]
width          = 10%
height         = 3%
offset-x       = 89%
offset-y       = 4%

background     = ${colors.background}
foreground     = ${colors.foreground}

font-0         = JetBrainsMonoNerdFontPropo;2

modules-right  = systray

override-redirect = true

cursor-click   = pointer
cursor-scroll  = ns-resize

enable-ipc     = true

;  ____       _   _   _
; / ___|  ___| |_| |_(_)_ __   __ _ ___
; \___ \ / _ \ __| __| | '_ \ / _` / __|
;  ___) |  __/ |_| |_| | | | | (_| \__ \
; |____/ \___|\__|\__|_|_| |_|\__, |___/
;                             |___/

[settings]
screenchange-reload = true
pseudo-transparency = true

;  __  __           _       _
; |  \/  | ___   __| |_   _| | ___  ___
; | |\/| |/ _ \ / _` | | | | |/ _ \/ __|
; | |  | | (_) | (_| | |_| | |  __/\__ \
; |_|  |_|\___/ \__,_|\__,_|_|\___||___/
;

[module/custom-menu]
type                          = custom/text
format                        = 
format-foreground             = ${colors.green}
format-padding                = 0

click-left                    = "rofi -show run"
click-right                   = "rofi -show power-menu -modi power-menu:$HOME/.config/rofi/scripts/powermenu.sh"

[module/xworkspaces]
type                          = internal/xworkspaces

; label-active                  = %name%
; label-active-background       = ${colors.background-alt}
; label-active-underline        = ${colors.mauve}
; label-active-padding          = 1
;
; label-occupied                = %name%
; label-occupied-padding        = 1
;
; label-urgent                  = %name%
; label-urgent-background       = ${colors.background-alt}
; label-urgent-padding          = 1
;
; label-empty                   = %name%
; label-empty-foreground        = ${colors.foreground}
; label-empty-padding           = 1

; icon-default			= 
icon-default			= 

label-active			= 
; label-active			= 
label-active-foreground		= ${colors.mauve}
label-active-padding		= 1

label-occupied			= 
label-occupied-foreground	= ${colors.overlay0}
label-occupied-padding		= 1

label-urgent			= 
label-urgent-foreground		= ${colors.red}
label-urgent-padding		= 1

; label-empty			= 
label-empty			= 
label-empty-foreground		= ${colors.foreground}
label-empty-padding		= 1

[module/xwindow]
type                          = internal/xwindow
label                         = %title:0:15:...%

[module/date]
type                          = internal/date
interval                      = 1

date                          = %a %h-%d | %H:%M
label                         = %date%
label-foreground              = ${colors.foreground}

[module/pulseaudio]
type                          = internal/pulseaudio

use-ui-max                    = true

interval                      = 5

format-volume-foreground      = ${colors.blue}
format-volume                 = <ramp-volume> <label-volume>

label-volume                  = %percentage%%

ramp-volume-0                 = 
ramp-volume-1                 = 
ramp-volume-2                 = 

label-muted                   = 󰝟 muted
label-muted-foreground        = ${colors.red}

click-right                   = pavucontrol

[module/backlight]
type			      = internal/backlight
interval		      = 5
card			      = acpi_video0

label                          = %percentage%%
format                        = 󰃠 <label>

[module/cpu]
type                          = internal/cpu
interval                      = 5
format-foreground             = ${colors.red}
label                         =  %percentage%%

[module/memory]
type                          = internal/memory
interval                      = 5
format-foreground             = ${colors.yellow}
label                         =  %mb_used%

[module/battery0]
type                          = internal/battery
full-at                       = 90 low-at                        = 10 battery                       = BAT0 adapter                       = ADP1

poll-interval                 = 5
time-format                   = %H:%M

label-charging                = 󱟠 %percentage%% - %time%h
label-discharging             = 󱟞 %percentage%% - %time%h
label-full                    = 󰂄 Full
label-low                     = 󰂃 LOW - %time%h

format-charging-foreground    = ${colors.blue}
format-discharging-foreground = ${colors.blue}
format-full-foreground        = ${colors.blue}

[module/battery1]
type                          = internal/battery

full-at                       = 90
low-at                        = 10

battery                       = BAT1
adapter                       = ADP1

poll-interval                 = 5
time-format                   = %H:%M

label-charging                = 󱟠 %percentage%% - %time%h
label-discharging             = 󱟞 %percentage%% - %time%h
label-full                    = 󰂄 Full
label-low                     = 󰂃 LOW - %time%h

format-charging-foreground    = ${colors.blue}
format-discharging-foreground = ${colors.blue}
format-full-foreground        = ${colors.blue}

[module/custom-tray]
type                          = custom/text

format                        = 
format-foreground             = ${colors.foreground} 
click-left                    = "${HOME}/.config/polybar/tray.sh"

[module/systray]
type                          = internal/tray
format-margin                 = 4pt
tray-spacing                  = 12pt
